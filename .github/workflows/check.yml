name: check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: argumentcomputer/ci-workflows/.github/actions/lint-workflows@2a6b43be08a6dab790e870c1717b79be2d6e70bc

  flake-check:
    name: "nixos: nix flake check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28 # v3.23.3
      # Eval-only: catches syntax errors, bad option names, and broken
      # module wiring across both hosts, the microvm guest, and the
      # standalone HM/nvim outputs without building any derivations.
      - run: nix flake check --no-build .
