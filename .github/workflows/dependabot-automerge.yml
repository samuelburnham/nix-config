name: dependabot-automerge

# Queue GitHub auto-merge on non-major Dependabot updates. The PR merges
# only once branch protection's required checks pass; majors stay manual.
# Dependabot only updates action pins, leaving Nix derivations unchanged.
# GITHUB_TOKEN suppresses push-triggered builds after these merges.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  automerge:
    name: Enable auto-merge
    # The PR author, unlike github.actor, cannot be spoofed by a re-run.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
