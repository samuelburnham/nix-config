name: cache

# Cache complete system and home environments for local rebuilds and cloud
# machines. The desktop system closure includes the dev microVM.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build and cache ${{ matrix.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: desktop + dev microVM
            target: nixosConfigurations.nixos.config.system.build.toplevel
          - name: laptop
            target: nixosConfigurations.nixbook.config.system.build.toplevel
          - name: home + Neovim
            target: sam
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Free space for system closures
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: DeterminateSystems/determinate-nix-action@d0c908e6cbe9f89f36ed8205a3ab6f092636916a # v3.23.1
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: samuelburnham
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: true
      - name: Build configuration
        env:
          NIX_TARGET: ${{ matrix.target }}
        run: nix build --accept-flake-config --no-write-lock-file --print-build-logs "./nixos#$NIX_TARGET"
      # The daemon caches intermediate builds; this also covers substituted roots.
      - name: Push configuration closure
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: cachix push samuelburnham ./result
