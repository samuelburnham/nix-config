name: update-flake-lock

on:
  workflow_dispatch:
  schedule:
    # Weekly, Sunday 00:00 UTC.
    - cron: '0 0 * * 0'

jobs:
  nixos:
    name: "flake.lock"
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@d0c908e6cbe9f89f36ed8205a3ab6f092636916a # v3.23.1
      - uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          pr-title: "nixos: update flake.lock"
          pr-labels: |
            dependencies
            automated
            nixos
