name: update-flake-lock

on:
  workflow_dispatch:
  schedule:
    # Monthly, alongside Dependabot's monthly run on the 1st.
    - cron: '0 0 1 * *'

jobs:
  nixos:
    name: "flake.lock"
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3.24.1
      # An App token lets the PR trigger `check` and its merge trigger `cache`.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: update
        uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          token: ${{ steps.app-token.outputs.token }}
          pr-title: "chore(flake): Update flake.lock"
          commit-msg: "chore(flake): Update flake.lock"
          pr-labels: |
            dependencies
            automated
            nixos
      - name: Enable auto-merge
        if: steps.update.outputs.pull-request-url != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ steps.update.outputs.pull-request-url }}
        run: gh pr merge --auto --squash "$PR_URL"
